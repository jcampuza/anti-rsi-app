name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Publish macOS arm64
    runs-on: macos-15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/tauri
          tauriScript: bun run tauri
          tagName: main-${{ github.run_number }}
          releaseName: Anti RSI main build ${{ github.run_number }}
          releaseBody: |
            Automated macOS build from main for Apple Silicon Macs.

            Commit: ${{ github.sha }}

            Anti RSI currently supports Apple Silicon Macs only. Intel Macs are not supported.

            This bundle is ad-hoc signed, not notarized. macOS may require manual approval in Privacy & Security before first launch.
          releaseDraft: false
          prerelease: true
          args: --target aarch64-apple-darwin
