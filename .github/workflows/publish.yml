name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: Publish macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
            target: aarch64-apple-darwin
          - arch: x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri -> target

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish Tauri bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/tauri
          tauriScript: bun run tauri
          tagName: main-${{ github.run_number }}
          releaseName: Anti RSI main build ${{ github.run_number }}
          releaseBody: |
            Automated macOS build from main.

            Commit: ${{ github.sha }}

            These bundles are ad-hoc signed, not notarized. macOS may require manual approval in Privacy & Security before first launch.
          releaseDraft: false
          prerelease: true
          args: --target ${{ matrix.target }}
