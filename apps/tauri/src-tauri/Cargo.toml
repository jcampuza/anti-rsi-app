[package]
name = "antirsi-tauri"
version = "0.1.0"
description = "Tauri shell for Anti RSI"
authors = ["Joseph Campuzano"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.84"

[lib]
name = "antirsi_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
futures-util = "0.3.32"
rand = "0.9.2"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tauri = { version = "2.11.3", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-shell = "2.3.5"
tokio = { version = "1.52.3", features = ["time"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = "0.3.2"
